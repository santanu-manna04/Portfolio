services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      MONGO_URI: mongodb://mongo:27017/portfolio
    depends_on: [mongo]
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [backend]

volumes:
  mongo-data:
  uploads-data:
